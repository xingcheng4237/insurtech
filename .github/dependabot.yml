version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "automated"
      - "github-actions"
    assignees:
      - "xingcheng4237"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "automated"
    assignees:
      - "xingcheng4237"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      express-runtime:
        dependency-type: "production"
        patterns:
          - "express"
          - "@types/express"
          - "express-*"
          - "body-parser"
          - "qs"
          - "path-to-regexp"
      production-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
